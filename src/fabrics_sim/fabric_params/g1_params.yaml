fabric_params:
  joint_posture_attractor:
    metric: 0.5
    stiffness: 20.0
    damping: 8.0
    max_acceleration: 30.0
  # --------------------------------------------------------------------------
  # Pelvis 6-D SE(3) task
  # Ordering:
  #   position:    world x, y, z
  #   orientation: world rotation x, y, z
  # --------------------------------------------------------------------------
  pelvis_pose_attractor:
    position_metric:
      - 5.0
      - 5.0
      - 15.0

    orientation_metric:
      - 10.0
      - 10.0
      - 5.0

    position_stiffness:
      - 30.0
      - 30.0
      - 60.0

    position_damping:
      - 10.0
      - 10.0
      - 16.0

    orientation_stiffness:
      - 50.0
      - 50.0
      - 25.0

    orientation_damping:
      - 14.0
      - 14.0
      - 10.0

  # Whole-body COM task, computed from every URDF link inertial origin/mass.
  # Highest-weight motion task: 10x previous COM metric, with every axis above
  # other leaf task metrics. This is a soft preference, NOT lexicographic
  # priority after Jacobian pullback or a relaxation of QP safety constraints.
  # Keep horizontal emphasis and leave PD gains/acceleration limits unchanged.
  center_of_mass_attractor:
    metric: [250.0, 250.0, 80.0]
    stiffness: [35.0, 35.0, 25.0]
    damping: [12.0, 12.0, 10.0]
    max_acceleration: [4.0, 4.0, 4.0]

  # --------------------------------------------------------------------------
  # Independent feet and hands SE(3) tasks. Each task is 12-D:
  # left end effector [px py pz rx ry rz], then right end effector.
  # --------------------------------------------------------------------------
  feet_pose_attractor:
    metric: [15.0, 15.0, 20.0, 12.0, 12.0, 8.0,
             15.0, 15.0, 20.0, 12.0, 12.0, 8.0]
    stiffness: [60.0, 60.0, 80.0, 50.0, 50.0, 30.0,
                60.0, 60.0, 80.0, 50.0, 50.0, 30.0]
    damping: [15.0, 15.0, 18.0, 14.0, 14.0, 10.0,
              15.0, 15.0, 18.0, 14.0, 14.0, 10.0]
    max_linear_acceleration: [15.0, 15.0]
    max_angular_acceleration: [25.0, 25.0]

  hand_pose_attractor:
    metric: [2.0, 2.0, 2.0, 1.0, 1.0, 1.0,
             2.0, 2.0, 2.0, 1.0, 1.0, 1.0]
    stiffness: [20.0, 20.0, 20.0, 15.0, 15.0, 15.0,
                20.0, 20.0, 20.0, 15.0, 15.0, 15.0]
    damping: [6.0, 6.0, 6.0, 5.0, 5.0, 5.0,
              6.0, 6.0, 6.0, 5.0, 5.0, 5.0]
    max_linear_acceleration: [10.0, 10.0]
    max_angular_acceleration: [20.0, 20.0]

  # --------------------------------------------------------------------------
  # Root-space damping added after all task pullbacks.
  # --------------------------------------------------------------------------
  cspace_damping:
    gain: 5.0

  # Optional energy regulation.
  speed_control:
    active: false
    energy_target: 10.0
    damping: 100.0

  # --------------------------------------------------------------------------
  # Final generalized-acceleration and jerk limits.
  #
  # Ordering:
  #   base linear(3), base angular(3), 29 actuated joints.
  #
  # Replace the 29 joint values with limits derived from the G1 model before
  # hardware deployment. These values are conservative software defaults.
  # --------------------------------------------------------------------------
  joint_limits:
    active: true

    acceleration:
      # floating base: linear + angular
      - 20.0
      - 20.0
      - 20.0
      - 30.0
      - 30.0
      - 30.0
      # 29 actuated joints
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0
      - 30.0

    jerk:
      # floating base: linear + angular
      - 1000.0
      - 1000.0
      - 1000.0
      - 1500.0
      - 1500.0
      - 1500.0
      # 29 actuated joints
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
      - 1500.0
